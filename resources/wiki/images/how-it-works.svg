<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="370" rx="12"/>

  <!-- the program -->
  <rect class="box" x="24" y="105" width="170" height="120" rx="10" stroke-width="1.2"/>
  <text class="code" x="109" y="135" text-anchor="middle">main.go</text>
  <text class="title" x="109" y="159" text-anchor="middle">Your program</text>
  <text class="text" x="109" y="181" text-anchor="middle">describes the interface</text>
  <text class="text" x="109" y="198" text-anchor="middle">from its own variables,</text>
  <text class="text" x="109" y="215" text-anchor="middle">every frame</text>

  <!-- go-ui -->
  <path class="arrow" d="M194,165 H246" marker-end="url(#arrow)"/>
  <rect class="accent" x="250" y="24" width="260" height="282" rx="10" stroke-width="1.4"/>
  <text class="code" x="380" y="50" text-anchor="middle">ui.Context</text>
  <text class="title" x="380" y="72" text-anchor="middle">go-ui</text>

  <rect class="box" x="268" y="88" width="224" height="58" rx="8" stroke-width="1.2"/>
  <text class="code" x="282" y="111">Begin · controls</text>
  <text class="text" x="282" y="132">adds a box, returns a click</text>

  <rect class="box" x="268" y="160" width="224" height="58" rx="8" stroke-width="1.2"/>
  <text class="code" x="282" y="183">End · layout</text>
  <text class="text" x="282" y="204">fit, grow, place; claim the mouse</text>

  <rect class="box" x="268" y="232" width="224" height="58" rx="8" stroke-width="1.2"/>
  <text class="code" x="282" y="255">draw2d.List</text>
  <text class="text" x="282" y="276">boxes, shadows, text, icons</text>

  <path class="arrow" d="M380,146 V158" marker-end="url(#arrow)"/>
  <path class="arrow" d="M380,218 V230" marker-end="url(#arrow)"/>

  <!-- go-renderer -->
  <path class="arrow" d="M510,261 C545,261 545,165 572,165" marker-end="url(#arrow)"/>
  <rect class="box" x="576" y="105" width="280" height="120" rx="10" stroke-width="1.2"/>
  <text class="code" x="596" y="135">go-renderer</text>
  <text class="title" x="596" y="159">Painted in one draw call</text>
  <text class="text" x="596" y="181">over a 3D scene or a plain window,</text>
  <text class="text" x="596" y="198">on a desktop, in a web page</text>
  <text class="text" x="596" y="215">or on Android</text>

  <!-- input back -->
  <path class="arrow" d="M716,225 V316 Q716,330 702,330 H394 Q380,330 380,318 V310" marker-end="url(#arrow)"/>
  <text class="label" x="548" y="352" text-anchor="middle">input.State: mouse, keys, touches, for the next frame</text>
</svg>
