<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="680" height="250" rx="12"/>
  <text class="title" x="40" y="36">A row 600 px wide: padding 10, gap 10</text>
  <rect class="box" x="40" y="50" width="600" height="80" rx="8" stroke-width="1.2"/>
  <rect class="box" x="50" y="60" width="120" height="60" rx="6" stroke-width="1.2"/>
  <text class="code" x="110" y="86" text-anchor="middle">Fixed(120)</text>
  <text class="text" x="110" y="106" text-anchor="middle">120</text>
  <rect class="box" x="180" y="60" width="90" height="60" rx="6" stroke-width="1.2"/>
  <text class="code" x="225" y="86" text-anchor="middle">Fit()</text>
  <text class="text" x="225" y="106" text-anchor="middle">its text: 90</text>
  <rect class="accent" x="280" y="60" width="113" height="60" rx="6" stroke-width="1.4"/>
  <text class="code" x="336" y="86" text-anchor="middle">Grow()</text>
  <text class="text" x="336" y="106" text-anchor="middle">1 share: 113</text>
  <rect class="accent" x="403" y="60" width="227" height="60" rx="6" stroke-width="1.4"/>
  <text class="code" x="516" y="86" text-anchor="middle">GrowBy(2)</text>
  <text class="text" x="516" y="106" text-anchor="middle">2 shares: 227</text>
  <text class="title" x="40" y="168">How the 340 px left are shared</text>
  <text class="text" x="40" y="192">inner 580 − fixed 120 − fit 90 − three gaps 30 = 340, split 1 : 2 between the growing boxes</text>
  <text class="text" x="40" y="214">(a box with a Max stops there, and what it leaves goes to the others)</text>
</svg>
