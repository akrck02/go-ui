<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="330" rx="12"/>
  <text class="title" x="40" y="38">From the back to the front</text>
  <text class="text" x="40" y="58">Each layer is drawn over the ones before it, and gets the mouse before them.</text>

  <rect class="box" x="40" y="250" width="800" height="52" rx="8" stroke-width="1.2"/>
  <text class="code" x="60" y="274">the screen</text>
  <text class="text" x="210" y="274">controls outside any panel: bars, side columns, a status bar;</text>
  <text class="text" x="210" y="291">a growing box left transparent lets the 3D view show through</text>

  <rect class="box" x="70" y="200" width="770" height="44" rx="8" stroke-width="1.2"/>
  <text class="code" x="90" y="227">Panel</text>
  <text class="text" x="210" y="227">floating cards with a title bar; pressing one brings it to the front</text>

  <rect class="box" x="100" y="150" width="740" height="44" rx="8" stroke-width="1.2"/>
  <text class="code" x="120" y="177">Overlay</text>
  <text class="text" x="210" y="177">the program's own content over everything, nothing dimmed (a note)</text>

  <rect class="box" x="130" y="100" width="710" height="44" rx="8" stroke-width="1.2"/>
  <text class="code" x="150" y="127">Modal · Sheet</text>
  <text class="text" x="270" y="127">dims what is behind and takes the mouse and the keyboard</text>

  <rect class="accent" x="160" y="70" width="680" height="24" rx="6" stroke-width="1.4"/>
  <text class="code" x="180" y="87">popups</text>
  <text class="text" x="270" y="87">a select's list, a menu, a tooltip: next to the control that opened them</text>
</svg>
